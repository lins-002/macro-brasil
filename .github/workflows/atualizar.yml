name: Atualizar dados

on:
  # Todo dia às ~08:17 no horário de Brasília (11:17 UTC).
  # O minuto 17 (e não 00) evita o pico de horário cheio, quando o GitHub
  # costuma atrasar ou descartar execuções agendadas.
  schedule:
    - cron: "17 11 * * *"
  # Permite rodar manualmente pela aba Actions (botão "Run workflow")
  workflow_dispatch:

# Permissão para o robô gravar os JSONs atualizados no repositório
permissions:
  contents: write

# Evita duas execuções ao mesmo tempo
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # A API do Banco Central às vezes fica instável. Se a coleta falhar, espera
      # 2 minutos e tenta de novo (até 3 vezes). É seguro repetir: o que já foi
      # coletado com sucesso não é regravado.
      - name: Coletar dados do Banco Central
        id: coleta
        continue-on-error: true
        run: |
          for tentativa in 1 2 3; do
            echo "=== Tentativa $tentativa de 3 ==="
            if python scripts/atualizar_dados.py; then
              exit 0
            fi
            if [ "$tentativa" -lt 3 ]; then
              echo "Falhou. Aguardando 2 minutos para tentar de novo..."
              sleep 120
            fi
          done
          exit 1

      - name: Gravar mudanças (se houver)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados."
          else
            git commit -m "Atualiza dados (automático)"
            git push
          fi

      # Se a coleta falhou, marca a execução como falha para o GitHub avisar por e-mail
      - name: Avisar se a coleta falhou
        if: steps.coleta.outcome == 'failure'
        run: |
          echo "A coleta falhou para pelo menos uma série. Veja o log do passo 'Coletar dados do Banco Central'."
          exit 1
